              - paragraph [ref=e664]:
                - text: Fransa,
                - link "yerel saate" [ref=e665] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/UTC+03.00#Arabistan_Standart_Zaman_Dilimi
                - text: göre 18.00'da (15.00
                - link "UTC" [ref=e666] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/UTC±00.00
                - text: ) 88.966 kişi önünde maça başladı.
                - superscript [ref=e667]:
                  - link "[35]" [ref=e668] [cursor=pointer]:
                    - /url: "#cite_note-35"
                - text: Arjantin, 23. dakikada
                - link "Ousmane Dembélé" [ref=e669] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Ousmane_Dembélé
                - text: "'nin ceza sahası içindeki müdahalesiyle yerde kalan"
                - link "Ángel Di María" [ref=e670] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Ángel_Di_María
                - text: ile penaltı kazandı.
                - link "Lionel Messi" [ref=e671] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Lionel_Messi
                - text: "'nin sağ alt köşeye attığı penaltıyı gole çevirmesiyle Arjantin, 1-0 öne geçti. 36. dakikada bir karşı atak ile"
                - link "Alexis Mac Allister" [ref=e672] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Alexis_Mac_Allister
                - text: "'ın ceza sahasının sağ tarafından verdiği pasla topla buluşan Di Maria skoru 2-0 yaptı."
                - superscript [ref=e673]:
                  - link "[36]" [ref=e674] [cursor=pointer]:
                    - /url: "#cite_note-36"
                - text: Fransa, ilk yarı sonuna doğru iki oyuncu değişikliği yaptı ve ilk devreyi 2-0 geride bitirdi.
                - superscript [ref=e675]:
                  - link "[37]" [ref=e676] [cursor=pointer]:
                    - /url: "#cite_note-NBCNews-37"
                - text: Fransa, 80. dakikaya kadar bir gol şansı yakalayamadı. 80. dakikada
                - link "Randal Kolo Muani" [ref=e677] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Randal_Kolo_Muani
                - text: ","
                - link "Nicolás Otamendi" [ref=e678] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Nicolás_Otamendi
                - text: "'nin ceza sahası içindeki müdahalesiyle yerde kaldı ve Fransa penaltı kazandı."
                - link "Kylian Mbappé" [ref=e679] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Kylian_Mbappé
                - text: topu sol alt köşeye göndererek penaltıyı gole çevirdi ve skoru 2-1 yaptı. Bu golden 97 saniye sonra
                - link "Marcus Thuram" [ref=e680] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Marcus_Thuram
                - text: "'ın pasını sert bir vole ile gole çevirdi ve skor 2-2 oldu. Uzatmalarda Messi'nin ceza sahası dışından çektiği sert şut,"
                - link "Hugo Lloris" [ref=e681] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Hugo_Lloris
                - text: tarafından kurtarıldı. Normal sürede eşitlik bozulmayınca maç uzatma sürelerine kaldı. Messi, 108. dakikada
                - link "Lautaro Martínez" [ref=e682] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Lautaro_Martínez
                - text: "'in sağ taraftan kurtarılan şutu sonrası dönen topla buluşarak yakın mesafeden golü buldu. Fransa, 118. dakikada Mbappé'nin çektiği şutun ceza sahası içinde"
                - link "Gonzalo Montiel" [ref=e683] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Gonzalo_Montiel
                - text: "'in koluna çarpması sonucu tekrar penaltı kazandı."
                - superscript [ref=e684]:
                  - link "[38]" [ref=e685] [cursor=pointer]:
                    - /url: "#cite_note-38"
                - text: Topu kalenin soluna göndererek ağlarla buluşturan Mbappé,
                - link "1966" [ref=e686] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/1966_FIFA_Dünya_Kupası_finali
                - text: "'da İngiliz"
                - link "Geoff Hurst" [ref=e687] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Geoff_Hurst
                - text: "'tan sonra Dünya Kupası finallerinde"
                - link "hat-trick" [ref=e689] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Hat_trick
                - text: yapan ikinci futbolcu oldu.
                - superscript [ref=e690]:
                  - link "[37]" [ref=e691] [cursor=pointer]:
                    - /url: "#cite_note-NBCNews-37"
                - text: 123. dakikada
                - link "Ibrahima Konaté" [ref=e692] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Ibrahima_Konaté
                - text: "'nin orta sahadan uzun pasıyla ceza sahası içinde topla buluşan Kolo Muani, kaleci"
                - link "Emiliano Martínez" [ref=e693] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Emiliano_Martínez
                - text: ile karşı karşıya kaldı; ancak Martínez, Muani'nin şutunu kurtardı. 3-3 beraberlikle biten maç
                - link "seri penaltı atışlarına" [ref=e694] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Seri_penaltı_vuruşları
                - text: kaldı.
                - superscript [ref=e695]:
                  - link "[37]" [ref=e696] [cursor=pointer]:
                    - /url: "#cite_note-NBCNews-37"
              - paragraph [ref=e697]:
                - text: Böylelikle, üçüncü kez bir Dünya Kupası finali penaltılara kalmış oldu. Mbappé ve Messi, iki tarafın ilk penaltılarını kullanan isimler oldu ve penaltıları gole çevirmeyi başardılar. İkinci penaltı atışlarında
                - link "Kingsley Coman" [ref=e698] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Kingsley_Coman
                - text: "'ın kullandığı penaltı Emiliano Martínez tarafından kurtarılırken,"
                - link "Paulo Dybala" [ref=e699] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Paulo_Dybala
                - text: ise başarılı oldu ve skoru 2-1 yaptı. Üçüncü penaltı atışlarında Fransa,
                - link "Aurélien Tchouaméni" [ref=e700] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Aurélien_Tchouaméni
                - text: ile yine başarısız olurken Arjantin,
                - link "Leandro Paredes" [ref=e701] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/Leandro_Paredes
                - text: ile skoru 3-1 yaptı. Dördüncü penaltı atışlarında Kolo Muani başarılı olup Fransa'yı yarışın içerisinde tuttu. Arjantin tarafında 118. dakikada penaltıya sebebiyet veren Montiel'in eline hatasını telafi etmek için bir fırsat geçti. Montiel, bu fırsatı başarıyla değerlendirerek Arjantin'in
                - link "1986" [ref=e702] [cursor=pointer]:
                  - /url: https://tr.wikipedia.org/wiki/1986_FIFA_Dünya_Kupası
                - text: "'dan sonra ilk kez şampiyonluğa ulaşmasını sağladı."
                - superscript [ref=e703]:
                  - link "[39]" [ref=e704] [cursor=pointer]:
                    - /url: "#cite_note-39"
